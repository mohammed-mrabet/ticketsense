# docker compose up --build
#   API (documentation Swagger) : http://localhost:8000/docs
#   Tableau de bord             : http://localhost:8501

services:
  api:
    build: .
    image: ticketsense
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    image: ticketsense
    command: ["streamlit", "run", "src/ticketsense/dashboard.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
