name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, entraînement et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Entraînement des modèles
        env:
          PYTHONPATH: src
        run: |
          python -m ticketsense.train
          python -m ticketsense.clustering

      - name: Seuil de qualité (F1 macro catégorie >= 0.85)
        run: |
          python -c "
          import json, sys
          f1 = json.load(open('reports/metrics.json'))['category']['tfidf_logreg']['f1_macro']
          print(f'F1 macro catégorie : {f1}')
          sys.exit(0 if f1 >= 0.85 else 1)
          "

      - name: Tests (pytest)
        run: pytest -v

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Démarrage et vérification de l'API
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf -X POST http://localhost:8000/predict -H "Content-Type: application/json" \
            -d '{"body": "Imprimante hors ligne au 2e étage"}' | grep -q Impression
          curl -sf http://localhost:8501/_stcore/health
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
