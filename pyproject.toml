[project]
name = "ticketsense"
version = "1.0.0"
description = "Classification et analyse de tickets de support informatique par NLP"
requires-python = ">=3.11"
authors = [{ name = "Mohammed MRABET" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]

[tool.ruff.lint.flake8-bugbear]
# Depends() de FastAPI est prévu pour être utilisé en valeur par défaut.
extend-immutable-calls = ["fastapi.Depends"]
